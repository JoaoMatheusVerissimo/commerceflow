name: Foundation
on:
  push:
    branches: [master, 'codex/**']
  pull_request:
permissions:
  contents: read
concurrency:
  group: foundation-${{ github.ref }}
  cancel-in-progress: true
jobs:
  java:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Require Docker for PostgreSQL integration tests
        run: docker info
      - name: Lint, tests and build
        run: sh mvnw -B -ntp verify
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: apps/frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: apps/frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - run: npm audit --audit-level=high
  compose:
    needs: [java, frontend]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Generate ephemeral database password
        run: echo "DB_PASSWORD=$(openssl rand -hex 32)" >> "$GITHUB_ENV"
      - name: Build and start isolated stack
        run: docker compose up -d --build
      - name: Registration, profile, login, refresh, reuse and logout
        run: node scripts/smoke-foundation.mjs
      - name: Service logs on failure
        if: failure()
        run: docker compose logs --no-color --tail=150
      - name: Remove isolated CI stack
        if: always()
        run: docker compose down -v
