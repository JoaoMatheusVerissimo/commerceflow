name: commerceflow
services:
  auth-db:
    image: postgres:17.6-alpine
    environment:
      POSTGRES_DB: auth_db
      POSTGRES_USER: commerceflow
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
    ports: ["127.0.0.1:5433:5432"]
    volumes: ["auth-data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U commerceflow -d auth_db"]
      interval: 5s
      timeout: 3s
      retries: 10
  customer-db:
    image: postgres:17.6-alpine
    environment:
      POSTGRES_DB: customer_db
      POSTGRES_USER: commerceflow
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
    ports: ["127.0.0.1:5434:5432"]
    volumes: ["customer-data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U commerceflow -d customer_db"]
      interval: 5s
      timeout: 3s
      retries: 10
  auth-service:
    build: { context: ., dockerfile: services/auth-service/Dockerfile }
    environment:
      DB_URL: jdbc:postgresql://auth-db:5432/auth_db
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      CUSTOMER_SERVICE_URL: http://customer-service:8082
      JWT_ISSUER: http://localhost:8080/api/v1/auth
      SECURE_COOKIES: "false"
    depends_on:
      auth-db: { condition: service_healthy }
      customer-service: { condition: service_started }
  customer-service:
    build: { context: ., dockerfile: services/customer-service/Dockerfile }
    environment:
      DB_URL: jdbc:postgresql://customer-db:5432/customer_db
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      JWK_SET_URI: http://auth-service:8081/auth/.well-known/jwks.json
      JWT_ISSUER: http://localhost:8080/api/v1/auth
    depends_on:
      customer-db: { condition: service_healthy }
  gateway:
    build: { context: ., dockerfile: services/gateway/Dockerfile }
    ports: ["127.0.0.1:8080:8080"]
    environment:
      AUTH_SERVICE_URL: http://auth-service:8081
      CUSTOMER_SERVICE_URL: http://customer-service:8082
      CATALOG_SERVICE_URL: http://catalog-service:8083
      ORDER_SERVICE_URL: http://order-service:8084
      INVENTORY_SERVICE_URL: http://inventory-service:8085
      JWK_SET_URI: http://auth-service:8081/auth/.well-known/jwks.json
      JWT_ISSUER: http://localhost:8080/api/v1/auth
    depends_on:
      auth-service: { condition: service_started }
      customer-service: { condition: service_started }
  frontend:
    build: { context: ., dockerfile: apps/frontend/Dockerfile }
    ports: ["127.0.0.1:3000:80"]
    depends_on:
      gateway: { condition: service_started }
  catalog-db:
    image: postgres:17.6-alpine
    environment:
      POSTGRES_DB: catalog_db
      POSTGRES_USER: commerceflow
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
    ports: ["127.0.0.1:5435:5432"]
    volumes: ["catalog-data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U commerceflow -d catalog_db"]
      interval: 5s
      timeout: 3s
      retries: 10
  catalog-service:
    build: { context: ., dockerfile: services/catalog-service/Dockerfile }
    environment:
      DB_URL: jdbc:postgresql://catalog-db:5432/catalog_db
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      JWK_SET_URI: http://auth-service:8081/auth/.well-known/jwks.json
      JWT_ISSUER: http://localhost:8080/api/v1/auth
      CATALOG_DEMO_SEED: "true"
    depends_on:
      catalog-db: { condition: service_healthy }
  order-db:
    image: postgres:17.6-alpine
    environment:
      POSTGRES_DB: order_db
      POSTGRES_USER: commerceflow
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
    ports: ["127.0.0.1:5436:5432"]
    volumes: ["order-data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U commerceflow -d order_db"]
      interval: 5s
      timeout: 3s
      retries: 10
  order-service:
    build: { context: ., dockerfile: services/order-service/Dockerfile }
    environment:
      DB_URL: jdbc:postgresql://order-db:5432/order_db
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      CATALOG_SERVICE_URL: http://catalog-service:8083
      INVENTORY_SERVICE_URL: http://inventory-service:8085
      JWK_SET_URI: http://auth-service:8081/auth/.well-known/jwks.json
      JWT_ISSUER: http://localhost:8080/api/v1/auth
    depends_on:
      order-db: { condition: service_healthy }
      catalog-service: { condition: service_started }
      inventory-service: { condition: service_started }
  inventory-db:
    image: postgres:17.6-alpine
    environment:
      POSTGRES_DB: inventory_db
      POSTGRES_USER: commerceflow
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
    ports: ["127.0.0.1:5437:5432"]
    volumes: ["inventory-data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U commerceflow -d inventory_db"]
      interval: 5s
      timeout: 3s
      retries: 10
  inventory-service:
    build: { context: ., dockerfile: services/inventory-service/Dockerfile }
    environment:
      DB_URL: jdbc:postgresql://inventory-db:5432/inventory_db
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      JWK_SET_URI: http://auth-service:8081/auth/.well-known/jwks.json
      JWT_ISSUER: http://localhost:8080/api/v1/auth
      INVENTORY_DEMO_SEED: "true"
    depends_on:
      inventory-db: { condition: service_healthy }
volumes:
  inventory-data:
  order-data:
  auth-data:
  customer-data:
  catalog-data:
