server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: gateway
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: ${AUTH_JWK_SET_URI:http://localhost:8081/auth/.well-known/jwks.json}
          issuer-uri: ${AUTH_ISSUER:http://commerceflow.local/auth}
  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: auth-service
              uri: ${AUTH_SERVICE_URL:http://localhost:8081}
              predicates:
                - Path=/api/v1/auth/**
              filters:
                - StripPrefix=2
            - id: customer-service
              uri: ${CUSTOMER_SERVICE_URL:http://localhost:8082}
              predicates:
                - Path=/api/v1/customers/**
              filters:
                - StripPrefix=2

commerceflow:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}
  security:
    auth-rate-limit:
      requests: ${AUTH_RATE_LIMIT_REQUESTS:10}
      window: ${AUTH_RATE_LIMIT_WINDOW:PT1M}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
