server:
  port: ${SERVER_PORT:8081}
spring:
  application:
    name: auth-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/auth_db}
    username: ${DB_USERNAME:commerceflow}
    password: ${DB_PASSWORD:commerceflow_dev}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
commerceflow:
  security:
    issuer: ${JWT_ISSUER:http://localhost:8080/api/v1/auth}
    access-token-ttl: PT15M
    refresh-token-ttl: P30D
    secure-cookies: ${SECURE_COOKIES:false}
  services:
    customer-url: ${CUSTOMER_SERVICE_URL:http://localhost:8082}
